[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py7zip"
version = "0.7.3"
description = "An unofficial, cross-platform, lightweight wrapper for 7-Zip command-line binaries."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AliasfoxKDE", email = "AliasfoxKDE@gmail.com"},
]
dependencies = [
    "requests",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3 :: 9",
    "Programming Language :: Python :: 3 :: 10",
    "Programming Language :: Python :: 3 :: 11",
    "Programming Language :: Python :: 3 :: 12",
    "Programming Language :: Python :: 3 :: 13",
    "Programming Language :: Python :: 3 :: 14",
]
urls = {
    Homepage = "https://pypi.org/project/py7zip/",
    "Source Code" = "https://github.com/aliasfoxkde/py7zip",
    Documentation = "https://github.com/aliasfoxkde/py7zip/blob/main/README.md",
    "Project Page" = "https://py7zip.cyopsys.com",
}

[tool.setuptools.packages.find]
include = ["py7zip*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
