[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py7zip"
version = "0.7.3"
description = "An unofficial, cross-platform, lightweight wrapper for 7-Zip command-line binaries."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AliasfoxKDE", email = "AliasfoxKDE@gmail.com"},
]
dependencies = [
    "requests",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
[project.urls]
Homepage = "https://pypi.org/project/py7zip/"
"Source Code" = "https://github.com/aliasfoxkde/py7zip"
Documentation = "https://github.com/aliasfoxkde/py7zip/blob/main/README.md"
"Project Page" = "https://py7zip.cyopsys.com"

[tool.setuptools.packages.find]
include = ["py7zip*"]

[project.optional-dependencies]
# mypy 2.x dropped the Python 3.9 target this package still supports, so the
# strict typecheck gate constrains mypy to the maintained 1.x line (`mypy<2` —
# a range, not an exact pin) plus the requests stubs.  CI installs this extra
# instead of restating the constraint there.
typecheck = ["mypy<2", "types-requests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.mypy]
# The runtime package is checked strictly under the oldest supported
# interpreter (requires-python >= 3.9), so the gate fails on any stdlib or
# syntax drift that would not load on 3.9.  mypy 2.x dropped the 3.9
# target, hence the <2 constraint in the typecheck extra above.
python_version = "3.9"
strict = true
files = ["py7zip"]
