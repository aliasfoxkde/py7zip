[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py7zip"
version = "0.9.0"
description = "An unofficial, cross-platform, lightweight wrapper for 7-Zip command-line binaries."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AliasfoxKDE", email = "AliasfoxKDE@gmail.com"},
]
dependencies = [
    "requests",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3 :: 9",
    "Programming Language :: Python :: 3 :: 10",
    "Programming Language :: Python :: 3 :: 11",
    "Programming Language :: Python :: 3 :: 12",
    "Programming Language :: Python :: 3 :: 13",
    "Programming Language :: Python :: 3 :: 14",
]

[project.scripts]
py7zip = "py7zip.cli:main"
[project.urls]
Homepage = "https://pypi.org/project/py7zip/"
"Source Code" = "https://github.com/aliasfoxkde/py7zip"
Documentation = "https://github.com/aliasfoxkde/py7zip/blob/main/README.md"
"Project Page" = "https://py7zip.cyopsys.com"

[tool.setuptools.packages.find]
include = ["py7zip*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["py7zip"]
branch = true

[tool.coverage.report]
fail_under = 99
show_missing = true
precision = 1

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["img", "bin"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "A",      # builtins shadowing
    "C4",     # comprehensions
    "DTZ",    # naive datetimes
    "T10",    # no breakpoint()/pdb in library code
    "EM",     # exception message hygiene
    "ICN",    # import conventions
    "PYI",    # stub files
    "PT",     # pytest style
    "RET",    # return hygiene
    "SIM",    # simplification
    "TID",    # tidy imports
    "PL",     # pylint
    "RUF",    # ruff-specific
]
ignore = [
    "EM101",  # user-facing messages are literal strings by design
    "EM102",
    "PLR0913", # wrapper() keeps its historical signature
    "PLR2004", # numeric comparisons in protocol parsing are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]  # nested with in zipfile/urlopen patterns reads clearer
"py7zip/py7zip.py" = [
    "PLW0603",  # no global statements remain; reserved
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
