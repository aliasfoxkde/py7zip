name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip pytest requests
      - name: Run offline test suite
        run: python -m pytest tests -p no:cacheprovider

  typecheck:
    name: Strict type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install type checker
        # mypy 2.x dropped the Python 3.9 target; this project still
        # supports 3.9, so pin the maintained 1.x line (see pyproject.toml).
        run: python -m pip install --upgrade pip "mypy<2" types-requests
      - name: Run mypy (strict) on py7zip
        run: python -m mypy

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
